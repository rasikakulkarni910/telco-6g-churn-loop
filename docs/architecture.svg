<svg xmlns="http://www.w3.org/2000/svg" width="920" height="220" viewBox="0 0 920 220" role="img" aria-label="SCORE to EXPLAIN to ACT to PROVE closed loop">
  <rect width="920" height="220" fill="#0d1117"/>
  <text x="460" y="28" text-anchor="middle" fill="#8b949e" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial" font-size="14">Predict who leaves. Fix why. Prove it worked.</text>

  <!-- boxes -->
  <rect x="40" y="60" width="170" height="80" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="125" y="95" text-anchor="middle" fill="#58a6ff" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial" font-size="18" font-weight="700">1 · SCORE</text>
  <text x="125" y="118" text-anchor="middle" fill="#c9d1d9" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial" font-size="12">P(churn in 90d)</text>

  <rect x="260" y="60" width="170" height="80" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="345" y="95" text-anchor="middle" fill="#58a6ff" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial" font-size="18" font-weight="700">2 · EXPLAIN</text>
  <text x="345" y="118" text-anchor="middle" fill="#c9d1d9" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial" font-size="12">bill / QoS / usage / VIP</text>

  <rect x="480" y="60" width="170" height="80" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="565" y="95" text-anchor="middle" fill="#58a6ff" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial" font-size="18" font-weight="700">3 · ACT</text>
  <text x="565" y="118" text-anchor="middle" fill="#c9d1d9" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial" font-size="12">playbook + channel</text>

  <rect x="700" y="60" width="170" height="80" rx="10" fill="#238636" stroke="#3fb950" stroke-width="2"/>
  <text x="785" y="95" text-anchor="middle" fill="#ffffff" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial" font-size="18" font-weight="700">4 · PROVE</text>
  <text x="785" y="118" text-anchor="middle" fill="#d2f8d2" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial" font-size="12">treated vs control</text>

  <!-- forward arrows -->
  <path d="M215 100 H250" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M435 100 H470" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M655 100 H690" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- feedback -->
  <path d="M785 150 V175 H125 V145" fill="none" stroke="#f0883e" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowOrange)"/>
  <text x="460" y="195" text-anchor="middle" fill="#f0883e" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial" font-size="12">still at risk ’ re-enter loop · exit if churned or stabilized</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f0883e"/>
    </marker>
  </defs>
</svg>
